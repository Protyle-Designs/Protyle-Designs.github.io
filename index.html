<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>My Website</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    background:#fafafa;
    color:#222;
}

.hero{
    text-align:center;
    padding:100px 20px;
}

h1{
    font-size:48px;
    margin-bottom:10px;
}

.subtitle{
    font-size:20px;
    color:#666;
    max-width:700px;
    margin:auto;
}

.gallery{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    justify-content:center;
    padding:40px;
}

.gallery img{
    width:300px;
    border-radius:12px;
}

.contact{
    text-align:center;
    padding:60px 20px;
}
</style>
</head>

<body>

<section class="hero">
    <h1>Your Business Name</h1>
    <p class="subtitle">
        A short description about what you do.
    </p>
</section>

<section class="gallery">
    <img src="https://picsum.photos/600/400?1">
    <img src="https://picsum.photos/600/400?2">
    <img src="https://picsum.photos/600/400?3">
</section>

<section class="contact">
    <h2>Contact</h2>
    <p>hello@yourdomain.com</p>
</section>

</body>
</html>
